<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>MeshChat</title>
    <meta name="theme-color" content="#faf6ee" />
    <meta
      name="description"
      content="Serverless end-to-end encrypted peer-to-peer chat. No accounts, no servers."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%23c2703d%27/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #faf6ee;
        --sf: #fffdf8;
        --bd: #e9e0d0;
        --ac: #c2703d;
        --ac2: #f3e2d0;
        --t: #2e2922;
        --d: #8c8272;
        --ok: #5b8a5f;
        --wn: #d9a13b;
        --er: #c0564b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        overflow-x: hidden;
      }
      body {
        height: 100dvh;
      }
      main > * {
        min-width: 0;
      }
      [hidden] {
        display: none !important;
      }
      body {
        background: var(--bg);
        color: var(--t);
        font:
          15px/1.5 ui-rounded,
          "SF Pro Rounded",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      header,
      main {
        width: 100%;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 14px 16px 10px;
      }
      .logo {
        font-weight: 650;
        font-size: 17px;
      }
      .pill {
        white-space: nowrap;
        font-size: 12px;
        color: var(--d);
        background: #f1eadb;
        border-radius: 99px;
        padding: 3px 11px;
      }
      .pill.ok {
        color: var(--ok);
      }
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      button {
        background: var(--sf);
        border: 1px solid var(--bd);
        color: var(--t);
        border-radius: 12px;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s,
          transform 0.1s;
      }
      button:hover {
        border-color: var(--ac);
      }
      button:active {
        transform: scale(0.97);
      }
      button.pri,
      .seg button.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      input,
      textarea {
        font-size: 16px !important;
        background: var(--sf);
        border: 1px solid var(--bd);
        color: var(--t);
        border-radius: 12px;
        padding: 9px 12px;
        font: inherit;
        width: 100%;
        min-width: 0;
      }
      input:focus,
      textarea:focus,
      button:focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 1px;
      }
      .pnl {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        visibility: hidden;
        transition:
          grid-template-rows 0.35s ease,
          opacity 0.3s ease,
          visibility 0s 0.35s;
      }
      .pnl.on {
        grid-template-rows: 1fr;
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }
      .pnl > div {
        overflow: hidden;
        min-height: 0;
      }
      .box {
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 14px;
        margin: 0 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 2px 16px rgba(120, 90, 50, 0.06);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row > * {
        flex: 1;
      }
      .pad {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .code {
        font:
          600 20px ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 3px;
        color: var(--ac);
        text-align: center;
        user-select: all;
      }
      details summary {
        cursor: pointer;
        color: var(--d);
        font-size: 13px;
      }
      #qs,
      #qrl {
        font-size: 12px;
        color: var(--d);
        text-align: center;
      }
      #chat {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--sf);
        border: solid var(--bd);
        border-width: 1px 0 0;
        position: relative;
        overflow: hidden;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px max(16px, env(safe-area-inset-right)) 16px
          max(16px, env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 8px;
        overscroll-behavior: contain;
      }
      .msg {
        max-width: 80%;
        padding: 8px 13px;
        border-radius: 16px;
        background: #f7f1e5;
        align-self: flex-start;
        word-break: break-word;
      }
      .msg.me {
        align-self: flex-end;
        background: var(--ac2);
      }
      .chk {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        color: var(--d);
      }
      .chk input {
        width: auto;
      }
      .msg b {
        font-size: 11px;
        margin-right: 8px;
        display: inline-block;
        max-width: 9em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      .tk {
        font-size: 10px;
        color: var(--d);
        margin-left: 8px;
        font-style: normal;
      }
      #ty {
        height: 18px;
        padding: 0 18px;
        font-size: 12px;
        color: var(--d);
      }
      #f {
        display: flex;
        gap: 8px;
        padding: 10px 12px 12px;
      }
      #empty {
        position: absolute;
        inset: 0 0 70px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 24px;
      }
      #empty h2 {
        font-weight: 600;
      }
      #empty p {
        color: var(--d);
        max-width: 340px;
        font-size: 14px;
      }
      #empty .row {
        justify-content: center;
      }
      #empty button {
        flex: none;
        padding: 10px 20px;
      }
      #g {
        width: 100%;
        height: 300px;
        display: block;
      }
      #lg {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        font-size: 11px;
        color: var(--d);
      }
      #lg i {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 4px;
      }
      #ev {
        font:
          12px ui-monospace,
          Menlo,
          monospace;
        max-height: 140px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
        color: var(--d);
      }
      #ev .ok {
        color: var(--ok);
      }
      #ev .err {
        color: var(--er);
      }
      #ev .warn {
        color: #8a6a2c;
      }
      .seg {
        display: flex;
        gap: 4px;
      }
      .seg button {
        flex: 1;
        padding: 5px;
      }
      .m {
        display: none;
        flex-direction: column;
        gap: 6px;
      }
      .m.on {
        display: flex;
      }
      #qr {
        background: #fff;
        border: 1px solid var(--bd);
        border-radius: 10px;
        align-self: center;
        max-width: 100%;
        image-rendering: pixelated;
        display: none;
      }
      #cam {
        width: 100%;
        border-radius: 10px;
        max-height: 200px;
        background: #000;
      }
      #toasts {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(84px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 9;
        width: min(380px, calc(100vw - 24px));
        pointer-events: none;
      }
      .toast {
        background: var(--t);
        color: #fffdf8;
        border-radius: 12px;
        padding: 9px 14px;
        font-size: 13px;
        animation: in 0.25s;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
      }
      .toast.err {
        background: var(--er);
      }
      .toast.warn {
        background: #8a6a2c;
      }
      .toast.ok {
        background: var(--ok);
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @media (max-width: 600px) {
        .msg {
          max-width: 90%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <b class="logo">MeshChat</b><span id="st" class="pill">Not connected</span
      ><span style="flex: 1"></span><button id="bNet">Network</button
      ><button id="bInv" class="pri">Invite</button>
    </header>
    <main>
      <div class="pnl" id="pc">
        <div>
          <div class="box">
            <input
              id="nm"
              maxlength="16"
              autocomplete="nickname"
              placeholder="Your name (optional, max 16 characters)"
            /><label class="chk"
              ><input type="checkbox" id="nh" /> Fresh room: people who join
              later won't see earlier messages</label
            ><button id="bNew" class="pri" style="padding: 11px">
              Create private room
            </button>
            <div class="row">
              <input
                id="jc"
                maxlength="200"
                placeholder="…or paste an invite link / code"
                style="flex: 2"
              /><button id="bJoin">Join</button>
            </div>
            <div class="code" id="code" hidden></div>
            <div class="row" id="cr" hidden>
              <button id="bCL" class="pri">Copy invite link</button
              ><button id="bCC">Copy code</button>
            </div>
            <div id="qs"></div>
            <details>
              <summary>
                Advanced: manual pairing (QR / paste / link / Gist)
              </summary>
              <div class="pad" style="padding: 8px 0">
                <div class="seg" id="meth">
                  <button data-m="qr">1 · QR</button
                  ><button data-m="paste">2 · Paste</button
                  ><button data-m="link">3 · Link</button
                  ><button data-m="gist">4 · Gist</button>
                </div>
                <div class="row">
                  <button id="bHost">Host / add peer</button
                  ><button id="bApply">Apply</button
                  ><button id="bRe">Reconnect all</button>
                </div>
                <div class="m" data-m="qr">
                  <canvas id="qr"></canvas>
                  <div id="qrl"></div>
                  <button id="bScan">Scan QR</button
                  ><video id="cam" playsinline muted hidden></video>
                </div>
                <textarea
                  id="blob"
                  rows="3"
                  placeholder="Paste offer / answer / chunks / state blob or link here, then Apply"
                ></textarea>
                <div class="m" data-m="paste">
                  <button id="bCopy">Copy blob</button>
                </div>
                <div class="m" data-m="link">
                  <input
                    id="lnk"
                    readonly
                    placeholder="Link appears after Host/Apply"
                  />
                  <div class="row">
                    <button id="bLink">Copy link</button
                    ><button id="bShare">Share</button>
                  </div>
                </div>
                <div class="m" data-m="gist">
                  <div class="row">
                    <input
                      id="gist"
                      placeholder="Gist ID (paste the blob into it manually)"
                      style="flex: 3"
                    /><button id="bGist">Poll</button>
                  </div>
                </div>
                <input
                  id="pass"
                  type="password"
                  placeholder="Passphrase (PSK, authenticates key exchange; set before connecting)"
                  autocomplete="off"
                />
                <button id="bExp">Export state blob</button>
              </div>
            </details>
          </div>
        </div>
      </div>
      <div class="pnl" id="pn">
        <div>
          <div class="box">
            <div id="ms" style="font-size: 12px; color: var(--d)"></div>
            <canvas id="g" aria-label="Live network map"></canvas>
            <div id="lg"></div>
            <div id="ev"></div>
          </div>
        </div>
      </div>
      <section id="chat">
        <div id="log" role="log" aria-live="polite"></div>
        <div id="empty">
          <h2>Private chat, no servers</h2>
          <p>
            Messages go straight between browsers, end-to-end encrypted. Start a
            room and send the invite link.
          </p>
          <div class="row">
            <button id="eNew" class="pri">Create room</button
            ><button id="eJoin">Join room</button>
          </div>
        </div>
        <div id="ty"></div>
        <form id="f">
          <input
            id="in"
            maxlength="1000"
            autocomplete="off"
            placeholder="Message…"
          /><button class="pri">Send</button>
        </form>
      </section>
    </main>
    <div id="toasts" role="status"></div>
    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id),
          now = Date.now;
        const cleanName = (s) =>
          Array.from(
            String(s || "")
              .replace(/[\u0000-\u001f\u007f<>]/g, "")
              .replace(/\s+/g, " ")
              .trim(),
          )
            .slice(0, 16)
            .join("");
        const rid = () =>
          Array.from(crypto.getRandomValues(new Uint8Array(4)), (x) =>
            x.toString(16).padStart(2, "0"),
          ).join("");
        const hs = (s) => {
          let h = 0;
          for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
          return h >>> 0;
        };

        /* ===================== worker.js (built into a Blob Worker) =====================
   crypto.js (ECDH+HKDF ratchet+AES-GCM) · crdt.js (OR-Set + HLC + version vector)
   QR encode/decode · signal codec · force-directed graph layout                 */
        function workerMain() {
          "use strict";
          const E = new TextEncoder(),
            D = new TextDecoder(),
            ops = {};
          const b64 = (u) => {
            let s = "";
            for (let i = 0; i < u.length; i += 8192)
              s += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
            return btoa(s)
              .replace(/\+/g, "-")
              .replace(/\//g, "_")
              .replace(/=+$/, "");
          };
          const unb64 = (s) => {
            s = s.replace(/-/g, "+").replace(/_/g, "/");
            while (s.length % 4) s += "=";
            const r = atob(s),
              u = new Uint8Array(r.length);
            for (let i = 0; i < r.length; i++) u[i] = r.charCodeAt(i);
            return u;
          };
          const hex = (u) =>
            Array.from(u, (x) => x.toString(16).padStart(2, "0")).join("");
          const sha = async (s) =>
            hex(
              new Uint8Array(
                await crypto.subtle.digest("SHA-256", E.encode(s)),
              ),
            );
          const hs = (s) => {
            let h = 0;
            for (let i = 0; i < s.length; i++)
              h = (h * 31 + s.charCodeAt(i)) | 0;
            return h >>> 0;
          };
          /* ---- crypto.js: ephemeral ECDH P-256 per connection -> HKDF chains -> AES-GCM, ratchet every ROT packets ---- */
          const S = new Map(),
            ROT = 50,
            ECP = { name: "ECDH", namedCurve: "P-256" },
            Z = new Uint8Array();
          const hk = async (ikm, salt, info) =>
            new Uint8Array(
              await crypto.subtle.deriveBits(
                { name: "HKDF", hash: "SHA-256", salt, info: E.encode(info) },
                await crypto.subtle.importKey("raw", ikm, "HKDF", false, [
                  "deriveBits",
                ]),
                256,
              ),
            );
          const adv = async (c) => {
            c.k = await crypto.subtle.importKey(
              "raw",
              await hk(c.ck, Z, "key"),
              "AES-GCM",
              false,
              ["encrypt", "decrypt"],
            );
            c.ck = await hk(c.ck, Z, "chain");
            c.e++;
          };
          const seq = (s, q, f) => {
            const p = s[q].then(f);
            s[q] = p.catch(() => {});
            return p;
          };
          ops["cx.hs"] = async (sid) => {
            const kp = await crypto.subtle.generateKey(ECP, false, [
              "deriveBits",
            ]);
            S.set(sid, { kp, qt: Promise.resolve(), qr: Promise.resolve() });
            return b64(
              new Uint8Array(
                await crypto.subtle.exportKey("raw", kp.publicKey),
              ),
            );
          };
          ops["cx.up"] = async (sid, pub, init, salt) => {
            const s = S.get(sid);
            if (!s || !s.kp) throw new Error("no session");
            const pk = await crypto.subtle.importKey(
                "raw",
                unb64(pub),
                ECP,
                false,
                [],
              ),
              bits = new Uint8Array(
                await crypto.subtle.deriveBits(
                  { name: "ECDH", public: pk },
                  s.kp.privateKey,
                  256,
                ),
              );
            s.kp = null;
            const sl = E.encode(salt),
              a = await hk(bits, sl, "i2r"),
              b = await hk(bits, sl, "r2i");
            s.tx = { ck: init ? a : b, e: -1, n: 0 };
            s.rx = { ck: init ? b : a, e: -1 };
            await adv(s.tx);
            await adv(s.rx);
            return 1;
          };
          ops["cx.enc"] = (sid, str) => {
            const s = S.get(sid);
            if (!s || !s.tx) return Promise.reject(new Error("no session"));
            return seq(s, "qt", async () => {
              const t = s.tx;
              if (t.n >= ROT) {
                await adv(t);
                t.n = 0;
              }
              t.n++;
              const iv = crypto.getRandomValues(new Uint8Array(12)),
                ct = new Uint8Array(
                  await crypto.subtle.encrypt(
                    { name: "AES-GCM", iv },
                    t.k,
                    E.encode(str),
                  ),
                ),
                o = new Uint8Array(12 + ct.length);
              o.set(iv);
              o.set(ct, 12);
              return t.e + "." + b64(o);
            });
          };
          ops["cx.dec"] = (sid, str) => {
            const s = S.get(sid);
            if (!s || !s.rx) return Promise.reject(new Error("no session"));
            return seq(s, "qr", async () => {
              const r = s.rx,
                i = str.indexOf("."),
                e = +str.slice(0, i);
              if (!(e >= r.e && e - r.e <= 8)) throw new Error("epoch");
              while (r.e < e) await adv(r);
              const u = unb64(str.slice(i + 1));
              return D.decode(
                await crypto.subtle.decrypt(
                  { name: "AES-GCM", iv: u.subarray(0, 12) },
                  r.k,
                  u.subarray(12),
                ),
              );
            });
          };
          ops["cx.drop"] = (sid) => {
            S.delete(sid);
          };
          /* ---- crdt.js: bounded OR-Set of immutable messages + tombstones; HLC ordering; version vector ---- */
          const CAP = 500,
            C = {
              m: new Map(),
              ord: [],
              rm: new Map(),
              vv: {},
              l: 0,
              c: 0,
              me: "",
            };
          const cmp = (a, b) =>
            a.l - b.l ||
            a.c - b.c ||
            hs(a.s) - hs(b.s) ||
            (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
          const tick = (l, c) => {
            const L = Math.max(C.l, l || 0, Date.now());
            C.c =
              L === C.l && L === (l || 0)
                ? Math.max(C.c, c || 0) + 1
                : L === C.l
                  ? C.c + 1
                  : L === (l || 0)
                    ? (c || 0) + 1
                    : 0;
            C.l = L;
          };
          const mid = (m) =>
            sha(
              m.s +
                "|" +
                m.l +
                "." +
                m.c +
                "|" +
                m.q +
                "|" +
                (m.n || "") +
                "|" +
                m.x,
            );
          const valid = (m) =>
            m &&
            /^[0-9a-f]{64}$/.test(m.id) &&
            /^[0-9a-f]{8}$/.test(m.s) &&
            Number.isSafeInteger(m.l) &&
            Number.isSafeInteger(m.c) &&
            Number.isSafeInteger(m.q) &&
            typeof m.x === "string" &&
            m.x.length <= 1000 &&
            (m.n === undefined ||
              (typeof m.n === "string" && m.n.length <= 32)) &&
            m.l <= Date.now() + 36e5;
          function add(m) {
            if (C.m.has(m.id)) return false;
            const t = C.rm.get(m.id);
            if (t && t === m.s) return false;
            if (C.ord.length >= CAP && cmp(m, C.ord[0]) < 0) return false;
            let lo = 0,
              hi = C.ord.length;
            while (lo < hi) {
              const k = (lo + hi) >> 1;
              if (cmp(C.ord[k], m) < 0) lo = k + 1;
              else hi = k;
            }
            C.ord.splice(lo, 0, m);
            C.m.set(m.id, m);
            if (C.ord.length > CAP) C.m.delete(C.ord.shift().id);
            C.vv[m.s] = Math.max(C.vv[m.s] || 0, m.q);
            tick(m.l, m.c);
            return true;
          }
          function doRm(id, s) {
            const m = C.m.get(id);
            if (m && m.s !== s) return false;
            if (C.rm.get(id) === s) return false;
            C.rm.set(id, s);
            if (C.rm.size > CAP) C.rm.delete(C.rm.keys().next().value);
            if (m) {
              C.m.delete(id);
              C.ord.splice(C.ord.indexOf(m), 1);
            }
            return true;
          }
          ops.init = (me) => {
            C.me = me;
          };
          ops["crdt.reset"] = () => {
            C.m.clear();
            C.ord.length = 0;
            C.rm.clear();
            C.vv = {};
            return 1;
          };
          ops["crdt.local"] = async (x, n) => {
            tick();
            const q = (C.vv[C.me] || 0) + 1;
            C.vv[C.me] = q;
            const m = {
              s: C.me,
              l: C.l,

                await crypto.subtle.decrypt(
                  { name: "AES-GCM", iv: u.subarray(0, 12) },
                  bk,
                  u.subarray(12),
                ),
              ),
            );
          }
          /* Secret room: 100-bit random code. Broker sees only hash(topic) + AES-GCM ciphertext keyed from the code. */
          async function quick(code) {
            const te = new TextEncoder(),
              sh = async (s) =>
                new Uint8Array(
                  await crypto.subtle.digest("SHA-256", te.encode(s)),
                ),
              h = Array.from(await sh("mc1|" + code), (x) =>
                x.toString(16).padStart(2, "0"),
              ).join("");
            bk = await crypto.subtle.importKey(
              "raw",
              await sh("mc1k|" + code),
              "AES-GCM",
              false,
              ["encrypt", "decrypt"],
            );
            const nr = h.slice(16, 24);
            if (room && room !== nr) await resetRoom();
            room = nr;
            pass = code;
            Broker.open(
              "mc1/" + h.slice(0, 16),
              me,
              async (t, s) => {
                let p;
                try {
                  p = await bdec(s);
                } catch (e) {
                  return;
                }
                if (!p || typeof p !== "object") return;
                if (p.k === "hi" && ID.test(p.f) && p.f !== me) {
                  known.set(p.f, now());
                  const ol = links.get(p.f);
                  if (ol && now() - ol.last > 6000)
                    drop(ol, "peer re-announced");
                  const dl = dial.get(p.f);
                  if (dl && now() - dl.born > 4000) kill(dl);
                  if (t.endsWith("/all")) bpub(p.f, { k: "hi", f: me });
                  fillSoon();
                } else if (
                  p.k === "sg" &&
                  typeof p.i === "string" &&
                  p.to === me &&
                  sgSeen(p.i)
                )
                  handleSg(p);
              },
              (st) => {
                bst = st;
                evt("Rendezvous server: " + st, st === "up" ? "ok" : "warn");
                on.qstatus(st);
                if (st === "up") bpub("all", { k: "hi", f: me });
              },
            );
          }
          function retryTick() {
            const n = now();
            [...retry]
              .filter(([, r]) => r.at <= n)
              .sort((a, b) => b[1].pr - a[1].pr)
              .slice(0, 2)
              .forEach(([id, r]) => {
                if (links.has(id)) {
                  retry.delete(id);
                  return;
                }
                r.n++;
                r.at = n + Math.min(30000, 3000 * 2 ** r.n);
                if (r.n > 5) retry.delete(id);
                else {
                  evt("Retry #" + r.n + " → " + id.slice(0, 4), "info");
                  reach(id);
                }
              });
          }
          /* network change / tab resume / screen unlock: re-open broker, verify links, redial everything */
          function wake(force) {
            if (off) return;
            const t0 = now();
            evt("Network/tab resumed — checking links", "info");
            fails.clear();
            nudge.clear();
            retry.forEach((r) => {
              r.at = 0;
            });
            known.forEach((t, k) => known.set(k, t0));
            [
              ...dial.values(),
              ...[...pend.values()].filter((l) => !l.manual),
            ].forEach(kill);
            if (force || !Broker.ready || Broker.idle() > 20000) Broker.kick();
            links.forEach((l) => Rtc.send(l, { k: "p", t: t0 }));
            setTimeout(() => {
              if (off) return;
              links.forEach((l) => {
                if (l.last < t0) drop(l, "stale after resume");
              });
              known.forEach((t, id) => {
                if (!links.has(id)) reach(id);
              });
              fill();
            }, 2500);
          }
          hbT = setInterval(beat, 2000);
          function destroy() {
            off = true;
            Broker.close();
            clearInterval(hbT);
            clearTimeout(fillT);
            [...links.values(), ...pend.values(), ...dial.values()].forEach(
              kill,
            );
          }
          return {
            on,
            me,
            links,
            quick,
            wake,
            evt,
            setName: (v) => {
              nick = cleanName(v);
              clearTimeout(nmT);
              nmT = setTimeout(
                () => links.forEach((l) => Rtc.send(l, { k: "nm", n: nick })),
                600,
              );
            },
            nameOf: (id) => nms.get(id),
            setNoHist: (v) => {
              nohist = !!v;
            },
            get nohist() {
              return nohist;
            },
            get name() {
              return nick;
            },
            view,
            learn,
            graph,
            diag,
            host,
            join,
            accept,
            reconnectAll,
            destroy,
            warn,
            setPass: (p) => {
              pass = p;
            },
            get room() {
              return room;
            },
            get mode() {
              return mode;
            },
            get hub() {
              return hub;
            },
          };
        })();

        /* ===================== gossip.js — rumor push + anti-entropy pull, peer sampling ===================== */
        const Gossip = (() => {
          const seen = new Map();
          let aeT = 0,
            lastDiv = 0;
          const sn = (i) => {
            if (typeof i !== "string" || seen.has(i)) return false;
            seen.set(i, 1);
            if (seen.size > 2000) seen.delete(seen.keys().next().value);
            return true;
          };
          const open = () =>
            [...Mesh.links.values()].filter(
              (l) => l.sec && l.st !== "connecting",
            );
          const sampleW = (a, k) =>
            a
              .map((l) => [Math.random() ** (1 / Math.max(5, l.score)), l])
              .sort((x, y) => y[0] - x[0])
              .slice(0, k)
              .map((x) => x[1]);
          function push(a, r, h, except) {
            if (h > 6 || (!a.length && !r.length)) return;
            if (h > 0 && Math.random() > Math.max(0.4, 1 - 0.2 * h)) return;
            const c = open().filter((l) => l !== except);
            for (const l of sampleW(c, Math.ceil(Math.log2(c.length + 1)) + 1))
              Rtc.send(l, { k: "ms", a, r, h });
          }
          async function say(x) {
            const m = await W.call("crdt.local", [x, Mesh.name]);
            UI.dirty();
            push([m], [], 0, null);
          }
          async function retract(id) {
            const r = await W.call("crdt.rm", [id]);
            if (r) {
              UI.dirty();
              push([], [r], 0, null);
            }
          }
          function typing() {
            const i = rid();
            sn(i);
            for (const l of sampleW(open(), 2))
              Rtc.send(l, { k: "ty", i, s: Mesh.me, n: Mesh.name, h: 0 });
          }
          async function ae(l) {
            const s = await W.call("crdt.sum");
            Rtc.send(l, { k: "sv", h: s.h, n: s.n, vv: s.vv, v: Mesh.view() });
          }
          const hi = (l) => ae(l).catch(() => {});
          function loop() {
            aeT = setTimeout(
              async () => {
                try {
                  for (const l of sampleW(open(), 2)) await ae(l);
                } catch (e) {}
                loop();
              },
              3000 + Math.random() * 5000,
            );
          }
          async function sendIds(l, ids) {
            const g = await W.call("crdt.get", [ids]);
            if (Mesh.nohist) g.ms = g.ms.filter((m) => m.l >= l.born);
            if (!g.ms.length && g.rm.length)
              Rtc.send(l, { k: "ms", a: [], r: g.rm, h: 5 });
            for (let i = 0; i < g.ms.length; i += 12)
              Rtc.send(l, {
                k: "ms",
                a: g.ms.slice(i, i + 12),
                r: i ? [] : g.rm,
                h: 5,
              });
          }
          const okIds = (a) =>
            Array.isArray(a)
              ? a
                  .filter((x) => typeof x === "string" && x.length === 8)
                  .slice(0, 600)
              : [];
          const eqVV = (a, b) => {
            const k = Object.keys(a);
            return (
              b &&
              typeof b === "object" &&
              k.length === Object.keys(b).length &&
              k.every((x) => a[x] === b[x])
            );
          };
          async function handle(l, p) {
            try {
              switch (p.k) {
                case "ms": {
                  if (!Array.isArray(p.a) || p.a.length > 30) return;
                  const r = await W.call("crdt.merge", [
                    p.a,
                    Array.isArray(p.r) ? p.r.slice(0, 30) : [],
                  ]);
                  if (r.bad)
                    Mesh.warn(
                      r.bad +
                        " invalid/forged message(s) from " +
                        l.id +
                        " dropped",
                    );
                  if (r.added.length || r.rm.length) {
                    UI.dirty();
                    push(r.added, r.rm, (p.h | 0) + 1, l);
                  }
                  break;
                }
                case "sv": {
                  Mesh.learn(p.v);
                  const s = await W.call("crdt.sum");
                  if (s.h !== p.h) {
                    if (eqVV(s.vv, p.vv) && now() - lastDiv > 60000) {
                      lastDiv = now();
                      Mesh.warn(
                        "State divergence vs " +
                          l.id +
                          " at equal version vectors — reconciling",
                      );
                    }
                    Rtc.send(l, {
                      k: "sd",
                      ids: await W.call("crdt.ids"),
                      v: Mesh.view(),
                    });
                  }
                  break;
                }
                case "sd": {
                  Mesh.learn(p.v);
                  const th = okIds(p.ids),
                    ts = new Set(th),
                    mine = await W.call("crdt.ids"),
                    ms = new Set(mine),
                    give = mine.filter((i) => !ts.has(i)),
                    want = th.filter((i) => !ms.has(i));
                  if (give.length) await sendIds(l, give.slice(0, 120));
                  if (want.length)
                    Rtc.send(l, { k: "rq", ids: want.slice(0, 100) });
                  break;
                }
                case "rq":
                  await sendIds(l, okIds(p.ids).slice(0, 100));
                  break;
                case "ty":
                  if (!sn(p.i)) return;
                  UI.typing(String(p.s).slice(0, 8), cleanName(p.n));
                  if ((p.h | 0) < 3)
                    for (const x of sampleW(
                      open().filter((y) => y !== l),
                      2,
                    ))
                      Rtc.send(x, {
                        k: "ty",
                        i: p.i,
                        s: p.s,
                        n: p.n,
                        h: (p.h | 0) + 1,
                      });
                  break;
              }
            } catch (e) {
              Mesh.warn("Gossip handler error: " + e.message);
            }
          }
          loop();
          return {
            say,
            retract,
            typing,
            hi,
            handle,
            stop: () => clearTimeout(aeT),
          };
        })();

        /* ===================== signal.js — chunking, fallback chain helpers, QR scan ===================== */
        const Sig = (() => {
          const asm = new Map();
          let stream = null,
            iv = 0,
            busy = false;
          const chunks = (blob, n = 650) => {
            if (blob.length <= 900) return [blob];
            const id = rid().slice(0, 4),
              c = Math.ceil(blob.length / n);
            return Array.from(
              { length: c },
              (_, i) =>
                "MC1|" +
                id +
                "|" +
                (i + 1) +
                "|" +
                c +
                "|" +
                blob.slice(i * n, (i + 1) * n),
            );
          };
          function assemble(t) {
            const parts = t.trim().split(/\s+/).filter(Boolean);
            if (!parts.some((p) => p.startsWith("MC1|"))) return t.trim();
            let done = null;
            for (const p of parts) {
              if (!p.startsWith("MC1|")) continue;
              const [, id, i, n, ...r] = p.split("|");
              let g = asm.get(id);
              if (!g) {
                g = { n: +n, c: new Map() };
                asm.set(id, g);
                if (asm.size > 8) asm.delete(asm.keys().next().value);
              }
              if (!g.c.has(+i)) {
                g.c.set(+i, r.join("|"));
                UI.toast("Chunk " + g.c.size + "/" + g.n + " received", "info");
              }
              if (g.c.size === g.n) {
                done = Array.from({ length: g.n }, (_, k) =>
                  g.c.get(k + 1),
                ).join("");
                asm.delete(id);
              }
            }
            return done;
          }
          const stop = (v) => {
            clearInterval(iv);
            iv = 0;
            if (stream) {
              stream.getTracks().forEach((t) => t.stop());
              stream = null;
            }
            v.srcObject = null;
            v.hidden = true;
          };
          async function scan(v, cb) {
            if (stream) {
              stop(v);
              return;
            }
            if (!navigator.mediaDevices)
              throw new Error(
                "Camera unavailable (needs HTTPS) — paste manually",
              );
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: "environment" },
            });
            v.srcObject = stream;
            v.hidden = false;
            await v.play();
            iv = setInterval(async () => {
              if (busy || !v.videoWidth) return;
              busy = true;
              try {
                const bmp = await createImageBitmap(v),
                  t = await W.call("qr.dec", [bmp], [bmp]);
                if (t) cb(t);
              } catch (e) {
                if (/nodet/.test(e.message)) {
                  stop(v);
                  UI.toast(
                    "QR decoding not supported by this browser — use the phone camera app (opens the link) or paste",
                    "warn",
                  );
                }
              }
              busy = false;
            }, 300);
          }
          return { chunks, assemble, scan, stop };
        })();

        /* ===================== ui.js ===================== */
        const UI = (() => {
          const log = $("log"),
            cv = $("g"),
            cx = cv.getContext("2d"),
            M = Mesh.on,
            METHODS = ["qr", "paste", "link", "gist"],
            tyT = new Map(),
            hist = [];
          let off = 0,
            total = 0,
            busy = false,
            dT = 0,
            cT = 0,
            pm = new Map(),
            G = null,
            glast = "",
            run = false,
            cur = { blob: "", link: "" },
            role = "",
            mi = 0,
            pf = 0,
            carT = 0,
            gt = 0,
            glastTxt = "",
            W_ = 0,
            H_ = 0;
          const names = new Map(),
            label = (id) => Mesh.nameOf(id) || names.get(id) || id.slice(0, 4),
            remember = (id, n) => {
              if (!n) return;
              names.delete(id);
              names.set(id, n);
              if (names.size > 200) names.delete(names.keys().next().value);
            };
          const el = (t, c, x) => {
            const e = document.createElement(t);
            if (c) e.className = c;
            if (x != null) e.textContent = x;
            return e;
          };
          function toast(m, k = "info") {
            const t = $("toasts"),
              d = el("div", "toast " + k, m);
            t.append(d);
            while (t.children.length > 4) t.firstChild.remove();
            setTimeout(() => d.remove(), 5500);
          }
          const dirty = () => {
            if (!dT)
              dT = setTimeout(() => {
                dT = 0;
                refresh();
              }, 60);
          };
          function row(m) {
            const own = m.s === Mesh.me,
              d = el("div", "msg" + (own ? " me" : ""));
            d.dataset.id = m.id;
            remember(m.s, cleanName(m.n));
            const a = el(
              "b",
              "",
              own ? "you" : cleanName(m.n) || m.s.slice(0, 4),
            );
            a.title = m.s;
            a.style.color = "hsl(" + (hs(m.s) % 360) + " 45% 38%)";
            d.append(
              a,
              el("span", "", m.x),
              el(
                "i",
                "tk",
                new Date(m.l).toLocaleTimeString([], {
                  hour: "2-digit",
                  minute: "2-digit",
                }),
              ),
            );
            if (own) d.ondblclick = () => Gossip.retract(m.id);
            return d;
          }
          async function refresh() {
            if (busy) {
              dirty();
              return;
            }
            busy = true;
            try {
              const v = await W.call("crdt.view", [off, 120]);
              total = v.total;
              $("empty").hidden = total > 0 || !!curCode;
              const fol =
                off === 0 &&
                log.scrollHeight - log.scrollTop - log.clientHeight < 90;
              let aid = null,
                ad = 0;
              if (!fol)
                for (const c of log.children)
                  if (c.offsetTop + c.offsetHeight > log.scrollTop) {
                    aid = c.dataset.id;
                    ad = c.offsetTop - log.scrollTop;
                    break;
                  }
              const f = document.createDocumentFragment();
              for (const m of v.ms) f.append(row(m));
              log.replaceChildren(f);
              if (fol) log.scrollTop = log.scrollHeight;
              else if (aid) {
                const e = log.querySelector('[data-id="' + aid + '"]');
                if (e) log.scrollTop = e.offsetTop - ad;
              }
            } catch (e) {
              toast("Render failed: " + e.message, "err");
            }
            busy = false;
          }
          log.onscroll = () => {
            if (busy) return;
            if (log.scrollTop < 30 && total > off + 120) {
              off += 40;
              refresh();
            } else if (
              off > 0 &&
              log.scrollHeight - log.scrollTop - log.clientHeight < 30
            ) {
              off = Math.max(0, off - 40);
              refresh();
            }
          };
          const tyShow = () => {
            const a = [...tyT.keys()].map(label);
            $("ty").textContent = a.length ? a.join(", ") + " typing…" : "";
          };
          function typing(s, n) {
            remember(s, n);
            clearTimeout(tyT.get(s));
            tyT.set(
              s,
              setTimeout(() => {
                tyT.delete(s);
                tyShow();
              }, 3500),
            );
            tyShow();
          }
          $("f").onsubmit = (e) => {
            e.preventDefault();
            const x = $("in").value.trim();
            if (x) {
              $("in").value = "";
              Gossip.say(x).catch((er) =>
                toast("Send failed: " + er.message, "err"),
              );
            }
          };
          let lt = 0;
          $("in").oninput = () => {
            const n = now();
            if (n - lt > 2000) {
              lt = n;
              Gossip.typing();
            }
          };
          new ResizeObserver(() => {
            const d = devicePixelRatio || 1,
              r = cv.getBoundingClientRect();
            W_ = r.width;
            H_ = r.height;
            cv.width = W_ * d;
            cv.height = H_ * d;
            cx.setTransform(d, 0, 0, d, 0, 0);
          }).observe(cv);
          W.onpos = (d) => {
            pm = new Map(
              d.ids.map((id, i) => [id, [d.xy[2 * i], d.xy[2 * i + 1]]]),
            );
          };
          const COL = {
            self: "#c2703d",
            open: "#5b8a5f",
            unstable: "#d9a13b",
            dialing: "#3f7fbf",
            retry: "#c0564b",
            gone: "#a89d8a",
            via: "#9a7fb8",
          };
          const LBL = {
            open: "Connected",
            unstable: "Unstable",
            dialing: "Connecting",
            retry: "Reconnecting",
            gone: "Disconnected",
            via: "Via mesh",
          };
          $("lg").replaceChildren(
            ...Object.keys(LBL).map((k) => {
              const s = el("span", "", LBL[k]),
                i = el("i");
              i.style.background = COL[k];
              s.prepend(i);
              return s;
            }),
          );
          const sub = (n) =>
            n.st === "self"
              ? "this device"
              : n.st === "open"
                ? "connected" +
                  (n.rtt != null ? " · " + Math.round(n.rtt) + "ms" : "") +
                  " · score " +
                  n.score
                : n.st === "unstable"
                  ? "unstable · loss " + Math.round((n.loss || 0) * 100) + "%"
                  : n.st === "dialing"
                    ? "connecting " + Math.round(n.age / 1000) + "s"
                    : n.st === "retry"
                      ? "retry #" +
                        n.tries +
                        " in " +
                        Math.ceil(n.inMs / 1000) +
                        "s"
                      : n.st === "gone"
                        ? "disconnected · " + Math.round(n.ago / 1000) + "s ago"
                        : "via mesh";
          const ES = {
            open: ["#5b8a5f", 2, []],
            unstable: ["#d9a13b", 2, [6, 5]],
            dialing: ["#3f7fbf", 1.6, [5, 5]],
            retry: ["#c0564b", 1.2, [2, 5]],
            via: ["rgba(154,127,184,.5)", 1, [2, 4]],
          };
          let ls = 0;
          function layout() {
            const key =
              G.nodes
                .map((n) => n.id)
                .sort()
                .join() +
              "|" +
              G.edges
                .map((e) => e[0] + "-" + e[1])
                .sort()
                .join();
            if (key === glast) return;
            glast = key;
            const ix = new Map(G.nodes.map((n, i) => [n.id, i]));
            W.call("lay.set", [
              G.nodes.map((n) => n.id),
              G.edges
                .map(([a, b]) => [ix.get(a), ix.get(b)])
                .filter((e) => e[0] != null && e[1] != null),
              Mesh.me,
            ]).catch(() => {});
          }
          function frame(t) {
            if (document.hidden || !$("pn").classList.contains("on")) {
              run = false;
              return;
            }
            G = Mesh.graph();
            if (t - ls > 400) {
              ls = t;
              layout();
            }
            cx.clearRect(0, 0, W_, H_);
            const X = W_ / 2,
              Y = H_ / 2,
              P = (id) => {
                const p = pm.get(id);
                return p
                  ? [X + p[0] * (W_ / 2 - 46), Y + p[1] * (H_ / 2 - 40)]
                  : null;
              };
            for (const [a, b, k, rtt] of G.edges) {
              const A = P(a),
                B = P(b);
              if (!A || !B) continue;
              const S = ES[k] || ["#ccc", 1, []];
              cx.beginPath();
              cx.moveTo(A[0], A[1]);
              cx.lineTo(B[0], B[1]);
              cx.strokeStyle = S[0];
              cx.lineWidth = S[1];
              cx.setLineDash(S[2]);
              cx.lineDashOffset = k === "dialing" ? -t / 40 : 0;
              cx.stroke();
              cx.setLineDash([]);
              if (k === "open") {
                const f = (t / 1200) % 1;
                cx.fillStyle = S[0];
                cx.beginPath();
                cx.arc(
                  A[0] + (B[0] - A[0]) * f,
                  A[1] + (B[1] - A[1]) * f,
                  2.5,
                  0,
                  6.283,
                );
                cx.fill();
              }
              if (rtt != null && (k === "open" || k === "unstable")) {
                cx.fillStyle = "#8c8272";
                cx.font = "10px system-ui";
                cx.textAlign = "center";
                cx.fillText(
                  Math.round(rtt) + "ms",
                  (A[0] + B[0]) / 2,
                  (A[1] + B[1]) / 2 - 5,
                );
              }
            }
            for (const n of G.nodes) {
              const p = P(n.id);
              if (!p) continue;
              const c = COL[n.st] || COL.via,
                me = n.id === G.me,
                r = me ? 10 : 8;
              if (n.st === "dialing" || n.st === "retry") {
                const q = (t / 900) % 1;
                cx.strokeStyle = c;
                cx.lineWidth = 1.5;
                cx.globalAlpha = 1 - q;
                cx.beginPath();
                cx.arc(p[0], p[1], r + q * 14, 0, 6.283);
                cx.stroke();
                cx.globalAlpha = 1;
              }
              cx.beginPath();
              cx.arc(p[0], p[1], r, 0, 6.283);
              if (n.st === "gone" || n.st === "retry") {
                cx.fillStyle = "#fffdf8";
                cx.fill();
                cx.lineWidth = 2;
                cx.strokeStyle = c;
                cx.stroke();
              } else {
                cx.fillStyle = c;
                cx.fill();
              }
              cx.textAlign = "center";
              cx.fillStyle = "#2e2922";
              cx.font = "11px system-ui";
              cx.fillText(
                me ? Mesh.name || "you" : label(n.id),
                p[0],
                p[1] + r + 13,
              );
              cx.fillStyle = "#8c8272";
              cx.font = "10px system-ui";
              cx.fillText(sub(n), p[0], p[1] + r + 25);
            }
            requestAnimationFrame(frame);
          }
          const kick = () => {
            if (!run && !document.hidden && $("pn").classList.contains("on")) {
              run = true;
              requestAnimationFrame(frame);
            }
          };
          document.addEventListener("visibilitychange", kick);
          function sync() {
            G = Mesh.graph();
            layout();
            kick();
          }
          M.change = () => {
            if (!cT)
              cT = setTimeout(() => {
                cT = 0;
                sync();
                diag();
              }, 120);
          };
          function diag() {
            const d = Mesh.diag(),
              n = d.peers.filter((p) => p.st === "open").length,
              s = $("st");
            s.textContent = n
              ? "● " +
                n +
                " connected" +
                (d.mode === "full" ? "" : " · " + d.mode)
              : d.ever
                ? "Reconnecting…"
                : Mesh.room
                  ? "Waiting for peers…"
                  : "Not connected";
            s.className = "pill" + (n ? " ok" : "");
            if ($("pn").classList.contains("on")) {
              $("ms").textContent =
                "Network: " +
                (navigator.onLine ? "online" : "OFFLINE") +
                " · Rendezvous: " +
                (d.bst === "up"
                  ? "connected"
                  : d.bst === "connecting"
                    ? "connecting…"
                    : "unreachable, retrying") +
                " · Mode: " +
                d.mode +
                (d.hub ? " (hub " + d.hub.slice(0, 4) + ")" : "") +
                " · Density " +
                Math.round(d.density * 100) +
                "%";
              $("ev").replaceChildren(
                ...d.events.map((e) =>
                  el(
                    "div",
                    e.k || "",
                    new Date(e.t).toLocaleTimeString([], { hour12: false }) +
                      "  " +
                      e.m,
                  ),
                ),
              );
            }
            return d;
          }
          const tog = (id, f) => {
            const e = $(id);
            e.classList.toggle(
              "on",
              f === undefined ? !e.classList.contains("on") : f,
            );
            if (id === "pn") {
              kick();
              diag();
            }
          };
          $("bInv").onclick = () => tog("pc");
          $("bNet").onclick = () => tog("pn");
          $("eNew").onclick = () => $("bNew").click();
          $("eJoin").onclick = () => {
            tog("pc", true);
            setTimeout(() => $("jc").focus(), 350);
          };
          function setMethod(i) {
            mi = i;
            document
              .querySelectorAll("#meth button")
              .forEach((b) =>
                b.classList.toggle("on", b.dataset.m === METHODS[i]),
              );
            document
              .querySelectorAll(".m")
              .forEach((m) =>
                m.classList.toggle("on", m.dataset.m === METHODS[i]),
              );
          }
          document
            .querySelectorAll("#meth button")
            .forEach(
              (b) =>
                (b.onclick = () => setMethod(METHODS.indexOf(b.dataset.m))),
            );
          document.querySelectorAll("#tabs button").forEach(
            (b) =>
              (b.onclick = () => {
                document.body.dataset.tab = b.dataset.t;
                kick();
              }),
          );
          async function drawQR(text) {
            const q = $("qr"),
              r = await W.call("qr.gen", [text]),
              s = Math.max(2, Math.floor(300 / (r.n + 8))),
              z = (r.n + 8) * s;
            q.width = q.height = z;
            q.style.width = Math.min(z, 300) + "px";
            q.style.display = "block";
            const c = q.getContext("2d");
            c.fillStyle = "#fff";
            c.fillRect(0, 0, z, z);
            c.fillStyle = "#000";
            for (let y = 0; y < r.n; y++)
              for (let x = 0; x < r.n; x++)
                if (r.d[y * r.n + x])
                  c.fillRect((x + 4) * s, (y + 4) * s, s, s);
          }
          async function out(o, qrOk = true) {
            const blob = await W.call("sg.pack", [o]),
              link =
                location.origin + location.pathname + "#" + o.t + "=" + blob;
            cur = { blob, link };
            $("blob").value = blob;
            $("lnk").value = link;
            clearInterval(carT);
            carT = 0;
            $("qrl").textContent = "";
            if (!qrOk) {
              $("qr").style.display = "none";
              return;
            }
            const items = link.length <= 900 ? [link] : Sig.chunks(blob);
            let i = 0;
            const show = async () => {
              try {
                await drawQR(items[i]);
                $("qrl").textContent =
                  items.length > 1
                    ? "Chunk " +
                      (i + 1) +
                      "/" +
                      items.length +
                      " — scan all (auto-cycling)"
                    : "Scan with any camera app";
                i = (i + 1) % items.length;
              } catch (e) {
                clearInterval(carT);
                $("qr").style.display = "none";
                toast(
                  "QR failed: " + e.message + " — use Paste or Link",
                  "warn",
                );
              }
            };
            await show();
            if (items.length > 1) carT = setInterval(show, 1600);
          }
          async function importState(s) {
            if (!Array.isArray(s.l)) throw new Error("Bad state");
            const r = await W.call("crdt.merge", [s.l.slice(-300), []]);
            dirty();
            return r.added.length;
          }
          async function apply() {
            const b = Sig.assemble($("blob").value);
            if (b == null || b === "") return;
            let o;
            try {
              o = await W.call("sg.unpack", [b]);
              if (
                !o ||
                !["o", "a", "s"].includes(o.t) ||
                (o.t !== "s" && !/^v=0/.test(o.sdp || ""))
              )
                throw 0;
            } catch (e) {
              toast(
                "Invalid or corrupted blob — copy it again completely",
                "err",
              );
              return;
            }
            try {
              if (o.t === "o") {
                role = "join";
                await out(await Mesh.join(o));
                toast(
                  "Answer ready — return it to the host by your chosen method, then they press Apply",
                  "ok",
                );
              } else if (o.t === "a") {
                await Mesh.accept(o);
                toast("Answer applied — connecting…", "ok");
              } else
                toast(
                  "State merged (" + (await importState(o)) + " new)",
                  "ok",
                );
            } catch (e) {
              toast(e.message || "Could not apply blob (invalid SDP?)", "err");
            }
          }
          $("bHost").onclick = async () => {
            try {
              role = "host";
              await out(await Mesh.host());
              toast(
                "Offer ready — share it, then Apply the answer you receive",
                "ok",
              );
            } catch (e) {
              toast("Could not create offer: " + e.message, "err");
            }
          };
          $("bApply").onclick = apply;
          $("bRe").onclick = async () => {
            if (!Mesh.reconnectAll()) {
              try {
                role = "host";
                await out(await Mesh.host());
                toast("No live links — fresh offer generated", "warn");
              } catch (e) {
                toast(e.message, "err");
              }
            } else toast("Re-dialing known peers through the mesh…", "info");
          };
          async function copy(t) {
            try {
              await navigator.clipboard.writeText(t);
            } catch (e) {
              const b = $("blob");
              b.value = t;
              b.select();
              document.execCommand("copy");
            }
            toast("Copied", "ok");
          }
          $("bCopy").onclick = () => cur.blob && copy(cur.blob);
          $("bLink").onclick = () =>
            cur.link ? copy(cur.link) : toast("Nothing to link yet", "warn");
          $("bShare").onclick = () =>
            cur.link && navigator.share
              ? navigator.share({ url: cur.link }).catch(() => {})
              : toast("Sharing unsupported — copy the link", "warn");
          $("bExp").onclick = async () => {
            const s = await W.call("crdt.view", [0, 300]);
            await out({ t: "s", l: s.ms }, false);
            toast(
              "State exported to the box — Copy blob to back up or share",
              "ok",
            );
          };
          $("bScan").onclick = async () => {
            try {
              await Sig.scan($("cam"), (t) => {
                const b = Sig.assemble(t);
                if (b == null || b === "") return;
                Sig.stop($("cam"));
                $("blob").value = b;
                apply();
              });
            } catch (e) {
              Sig.stop($("cam"));
              toast(
                e.name === "NotAllowedError"
                  ? "Camera denied — falling back to Paste"
                  : e.message,
                "warn",
              );
              setMethod(1);
            }
          };
          $("pass").onchange = () => {
            Mesh.setPass($("pass").value);
            toast(
              "Passphrase set for NEW links — every peer must use the same one",
              "info",
            );
          };
          M.linked = (id) => {
            pf = 0;
            tog("pc", false);
            toast("Secure link established with " + id, "ok");
            dirty();
          };
          M.pairfail = async () => {
            pf++;
            if (pf >= 4) {
              toast(
                "All signaling routes failed — likely NAT/firewall blocking (no TURN). Try another network or device.",
                "err",
              );
              return;
            }
            setMethod((mi + 1) % 4);
            toast(
              "Pairing failed — switching to “" +
                METHODS[mi] +
                "”" +
                (role === "host"
                  ? ", new offer generated"
                  : "; ask the host for a fresh offer"),
              "warn",
            );
            if (role === "host") {
              try {
                await out(await Mesh.host());
              } catch (e) {}
            }
          };
          M.toast = toast;
          M.reset = () => {
            off = 0;
            names.clear();
            tyT.forEach(clearTimeout);
            tyT.clear();
            tyShow();
            dirty();
          };
          async function gpoll() {
            const id = $("gist").value.trim();
            if (!id) return;
            try {
              const r = await fetch(
                "https://api.github.com/gists/" + encodeURIComponent(id),
                { cache: "no-store" },
              );
              if (!r.ok) throw 0;
              const f = Object.values((await r.json()).files)[0],
                t = ((f && f.content) || "").trim();
              if (!t || t === glastTxt || t === cur.blob) return;
              glastTxt = t;
              $("blob").value = t;
              await apply();
            } catch (e) {
              toast(
                "Gist unreachable (blocked/private/rate-limited) — use another route",
                "warn",
              );
            }
          }
          $("bGist").onclick = gpoll;
          $("gist").onchange = () => {
            clearInterval(gt);
            gt = $("gist").value.trim() ? setInterval(gpoll, 60000) : 0;
          };
          let saved = "";
          try {
            saved = cleanName(localStorage.getItem("mc_name"));
          } catch (e) {}
          Mesh.setName(saved);
          $("nm").value = saved;
          $("nm").oninput = () => {
            const v = cleanName($("nm").value);
            Mesh.setName(v);
            try {
              v
                ? localStorage.setItem("mc_name", v)
                : localStorage.removeItem("mc_name");
            } catch (e) {}
          };
          $("nm").onblur = () => {
            $("nm").value = Mesh.name;
          };
          try {
            $("nh").checked = localStorage.getItem("mc_nohist") === "1";
          } catch (e) {}
          $("nh").onchange = () => {
            try {
              localStorage.setItem("mc_nohist", $("nh").checked ? "1" : "0");
            } catch (e) {}
          };
          let curCode = "";
          M.qstatus = (s) => {
            $("qs").textContent =
              s === "up"
                ? "Waiting for peers who enter the same code…"
                : s === "connecting"
                  ? "Contacting rendezvous server…"
                  : "Rendezvous server unreachable — retrying (or use manual pairing below)";
          };
          async function start(code, q) {
            curCode = code;
            Mesh.setNoHist(AL.indexOf(code[0]) >= 0 && AL.indexOf(code[0]) & 1);
            try {
              sessionStorage.setItem("mc_code", code);
            } catch (e) {}
            $("empty").hidden = true;
            if (!q) tog("pc", true);
            $("code").textContent = code.match(/.{4}/g).join("-");
            $("code").hidden = false;
            $("cr").hidden = false;
            try {
              await Mesh.quick(code);
            } catch (e) {
              toast("Could not start: " + e.message, "err");
            }
          }
          const AL = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
          $("bNew").onclick = () => {
            const c = Array.from(
              crypto.getRandomValues(new Uint8Array(16)),
              (b) => AL[b % 32],
            );
            c[0] = AL[(AL.indexOf(c[0]) & 30) | ($("nh").checked ? 1 : 0)];
            start(c.join(""));
          };
          $("bJoin").onclick = () => {
            const v = $("jc").value,
              m = v.match(/#c=([A-Za-z0-9-]+)/),
              c = (m ? m[1] : v).replace(/[^A-Za-z0-9]/g, "").toUpperCase();
            if (c.length !== 16) {
              toast("Paste the full invite link or 16-character code", "warn");
              return;
            }
            start(c);
          };
          $("jc").onkeydown = (e) => {
            if (e.key === "Enter") $("bJoin").click();
          };
          $("bCC").onclick = () => copy(curCode.match(/.{4}/g).join("-"));
          $("bCL").onclick = () =>
            copy(location.origin + location.pathname + "#c=" + curCode);
          setMethod(0);
          if (!W.ok) toast("Web Workers unavailable — app cannot run", "err");
          if (!window.RTCPeerConnection || !(crypto && crypto.subtle))
            toast("WebRTC/WebCrypto missing (needs HTTPS or localhost)", "err");
          W.call("init", [Mesh.me]).catch(() => {});
          const hc = location.hash.match(/^#c=([A-Za-z0-9]{16})$/);
          if (hc) {
            history.replaceState(null, "", location.pathname + location.search);
            document.body.dataset.tab = "con";
            start(hc[1], 1);
          } else {
            let sc = "";
            try {
              sc = sessionStorage.getItem("mc_code") || "";
            } catch (e) {}
            if (/^[A-Za-z0-9]{16}$/.test(sc)) start(sc, 1);
          }
          if (/^#[oas]=/.test(location.hash)) {
            $("blob").value = location.href;
            history.replaceState(null, "", location.pathname + location.search);
            document.body.dataset.tab = "con";
            apply();
          }
          addEventListener("online", () => {
            toast("Back online — reconnecting…", "info");
            Mesh.evt("Device back online", "ok");
            Mesh.wake(true);
          });
          addEventListener("offline", () => {
            Mesh.evt("Device went offline", "err");
            toast("You are offline — will reconnect automatically", "warn");
          });
          addEventListener("pageshow", (e) => {
            if (e.persisted) Mesh.wake();
          });
          document.addEventListener("resume", () => Mesh.wake());
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) Mesh.wake();
          });
          addEventListener("pagehide", () => {
            Gossip.stop();
            Mesh.destroy();
            clearInterval(gt);
            clearInterval(carT);
            W.kill();
          });
          sync();
          diag();
          dirty();
          return { toast, dirty, typing };
        })();
      })();
    </script>
  </body>
</html>
